<script>
  // Handle anchor links: smooth scroll if on same page, navigate if on different page
  document.addEventListener('click', function(e) {
    var link = e.target.closest('a');
    if (!link) return;
    var href = link.getAttribute('href');
    if (!href || href.indexOf('#') === -1) return;
    var hashIndex = href.indexOf('#');
    var hash = href.substring(hashIndex);
    var urlPart = href.substring(0, hashIndex);

    // If there's a URL part, check if we're on the same page
    if (urlPart) {
      var currentUrl = window.location.origin + window.location.pathname;
      // Normalize trailing slashes for comparison
      var targetBase = urlPart.replace(/\/$/, '');
      var currentBase = currentUrl.replace(/\/$/, '');
      if (targetBase !== currentBase) {
        // Different page — let the browser navigate normally
        return;
      }
    }

    // Same page — smooth scroll to the target
    var target = document.querySelector(hash);
    if (target) {
      e.preventDefault();
      target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      window.history.pushState(null, '', hash);
      var navLinks = document.querySelector('.nav-links');
      if (navLinks) navLinks.classList.remove('open');
    }
  });

  // Copy code block
  function copyCode(btn) {
    var code = btn.closest('.code-block').querySelector('.code-body').textContent;
    navigator.clipboard.writeText(code).then(function() {
      btn.textContent = 'Copied!';
      setTimeout(function() { btn.textContent = 'Copy'; }, 2000);
    });
  }

  // Hero entrance: staggered reveal on load
  (function() {
    var hero = document.getElementById('hero-stagger');
    if (!hero) return;
    requestAnimationFrame(function() {
      requestAnimationFrame(function() { hero.classList.add('is-shown'); });
    });
  })();

  // Terminal typewriter: types the command line, then cascades the output log
  function startTerminalTypewriter(root) {
    var cmdLine = root.querySelector('.term-line--cmd');
    var outLines = Array.prototype.slice.call(root.querySelectorAll('.term-line--out'));
    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    if (reduceMotion) {
      outLines.forEach(function(line) { line.classList.add('is-typed'); });
      return;
    }

    function typeSegments(line, onDone) {
      var segments = Array.prototype.slice.call(line.querySelectorAll('[data-type]'));
      var queue = [];
      segments.forEach(function(seg) {
        var text = seg.textContent;
        seg.textContent = '';
        for (var i = 0; i < text.length; i++) queue.push({ seg: seg, ch: text[i] });
      });
      var i = 0;
      (function step() {
        if (i >= queue.length) { onDone(); return; }
        queue[i].seg.textContent += queue[i].ch;
        i++;
        setTimeout(step, 26 + Math.random() * 34);
      })();
    }

    function cascadeOutput() {
      var cursor = cmdLine && cmdLine.querySelector('.term-cursor');
      if (cursor) {
        cursor.classList.remove('term-cursor--blink');
        cursor.classList.add('term-cursor--fade');
      }
      outLines.forEach(function(line, idx) {
        setTimeout(function() { line.classList.add('is-typed'); }, 260 + idx * 190);
      });
    }

    if (!cmdLine) { cascadeOutput(); return; }
    var cursor = cmdLine.querySelector('.term-cursor');
    if (cursor) cursor.classList.add('term-cursor--blink');
    setTimeout(function() { typeSegments(cmdLine, cascadeOutput); }, 420);
  }

  // Scroll-triggered reveal for cards, steps, and other .reveal elements
  (function() {
    var els = document.querySelectorAll('.reveal');
    if (!els.length) return;
    if (!('IntersectionObserver' in window)) {
      els.forEach(function(el) {
        el.classList.add('is-shown');
        if (el.hasAttribute('data-typewriter')) startTerminalTypewriter(el);
      });
      return;
    }
    var observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-shown');
          if (entry.target.hasAttribute('data-typewriter')) startTerminalTypewriter(entry.target);
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15, rootMargin: '0px 0px -40px 0px' });
    els.forEach(function(el) { observer.observe(el); });
  })();

  // Theme toggle
  (function() {
    var btn = document.getElementById('theme-toggle');
    if (!btn) return;
    btn.addEventListener('click', function() {
      var isLight = document.documentElement.getAttribute('data-theme') === 'light';
      if (isLight) {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('deploydeck-theme', 'dark');
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
        localStorage.setItem('deploydeck-theme', 'light');
      }
    });
  })();
</script>
